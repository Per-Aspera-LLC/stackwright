name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Re-publish all packages without requiring pending changesets'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # startsWith guards against the release workflow re-triggering on its own
    # version bump commit. Must stay in sync with the commit message below.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' &&
         !startsWith(github.event.head_commit.message, 'chore: version packages for release')) }}
    steps:
      - name: Generate PerAsperaCI token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PERASPECRACI_APP_ID }}
          private-key: ${{ secrets.PERASPERA_CI_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # -----------------------------------------------------------
      # Gate: skip the entire release if there's nothing to publish
      # -----------------------------------------------------------
      - name: Check for releasable changes
        id: check
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          CHANGESETS=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l)
          HAS_PRE=$( [ -f ".changeset/pre.json" ] && echo "true" || echo "false" )
          if [ "$CHANGESETS" -eq 0 ] && [ "$HAS_PRE" = "false" ] && [ "$FORCE_PUBLISH" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No pending changesets — nothing to release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Found $CHANGESETS changeset(s), prerelease mode: $HAS_PRE, force_publish: $FORCE_PUBLISH"
          fi

      # -----------------------------------------------------------
      # Version: exit alpha prerelease mode, then consume changesets
      # -----------------------------------------------------------
      - name: Exit prerelease mode
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ -f ".changeset/pre.json" ]; then
            pnpm changeset pre exit
            echo "Exited prerelease mode."
          else
            echo "Not in prerelease mode — skipping."
          fi

      - name: Version packages
        if: steps.check.outputs.skip != 'true'
        run: pnpm changeset version

      # -----------------------------------------------------------
      # Build & publish
      # -----------------------------------------------------------
      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: pnpm build

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/*/; do
            if [ -d "$dir/dist" ]; then
              cd "$dir"
              PKG_NAME=$(node -p "require('./package.json').name")
              PKG_VERSION=$(node -p "require('./package.json').version")
              echo "Publishing $PKG_NAME@$PKG_VERSION..."
              if npm view "${PKG_NAME}@${PKG_VERSION}" > /dev/null 2>&1; then
                echo "↳ Already published — skipping"
              else
                pnpm publish --access public --no-git-checks
              fi
              cd - > /dev/null
            fi
          done

      # -----------------------------------------------------------
      # Push version bumps back, then sync dev
      # -----------------------------------------------------------
      - name: Commit and push version bumps
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: version packages for release" || echo "No changes to commit"
          git push origin main

      - name: Back-merge into dev
        if: steps.check.outputs.skip != 'true'
        run: |
          git fetch origin dev
          git checkout dev
          git pull origin dev
          # Rebase dev's unique commits onto main for clean, linear history.
          # Using rebase (instead of merge) prevents phantom commits from
          # accumulating in dev's ancestry — which previously caused dev→main
          # PRs to show dozens of already-released commits.
          #
          # -X ours: when conflicts arise (e.g. version numbers in package.json),
          # prefer main's graduated stable versions over dev's stale alpha versions.
          git rebase origin/main -X ours || true
          while [ -d ".git/rebase-merge" ]; do
            if git status --porcelain | grep -q "pre.json"; then
              # Expected: pre.json was deleted by `changeset pre exit` on main,
              # but dev's alpha-bump commits still modified it. Accept the deletion.
              git rm -f .changeset/pre.json 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || true
            else
              echo "Unexpected rebase conflict — aborting"
              git rebase --abort
              exit 1
            fi
          done
          # Re-enter prerelease mode so the next dev push produces alphas.
          if [ ! -f ".changeset/pre.json" ]; then
            pnpm changeset pre enter alpha
            git add .changeset/pre.json
            git commit -m "chore: re-enter prerelease mode after back-merge"
          fi
          # Force push is required after a rebase to rewrite dev's remote history.
          git push origin dev --force-with-lease
