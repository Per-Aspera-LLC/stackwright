title: "Stackwright"
meta:
  description: "YAML is the syntax. The schema is the safety net. AI writes the code. From API spec to working Next.js app in hours — safe by construction."

appBar:
  titleText: ""
  backgroundColor: "primary"
  textColor: "#1A1A2E"   # Dark navy for readability on yellow
  colorModeToggle: true
  logo:
    type: image
    src: ./stackwright-alt.png
    height: 60
    width: 180

navigation:
  - label: "Home"
    href: "/"
  - label: "Getting Started"
    href: "/getting-started"
#  - label: "⌨️ CLI"
#    href: "/cli"
  - label: "🦦 Raft"
    href: "/otter-raft"

# Search configuration (Cmd+K to open)
search:
  enabled: true
  placeholder: "Search docs... ⌘K"

# Sidebar navigation (persistent left sidebar)
sidebar:
  navigation:
    - section: "Learn"
      items:
        - label: "\U0001F680 Getting Started"
          href: "/getting-started"
        - label: "\U0001F4E6 Content Types"
          href: "/content-types"
        - label: "\U0001F9EA Showcase"
          href: "/showcase"
    - section: "Reference"
      items:
        - label: "\U0001F3D7\uFE0F Architecture"
          href: "/architecture"
        - label: "\u2328\uFE0F CLI Reference"
          href: "/cli"
        - label: "\U0001F916 Otter Raft"
          href: "/otter-raft"
    - section: "More"
      items:
        - label: "\U0001F510 Pro"
          href: "/pro"
        - label: "\U0001F64F Acknowledgements"
          href: "/acknowledgements"

  collapsed: false
  width: 260
  mobileBreakpoint: 768

footer:
  backgroundColor: "primary"
  textColor: "#1A1A2E"
  links:
    - label: "🦦 Built with StackWright 🦦"
      href: "https://github.com/Per-Aspera-LLC/stackwright"
    - label: "Source for this Site"
      href: "https://github.com/Per-Aspera-LLC/stackwright/tree/main/examples/stackwright-docs"
    - section: "Legal"
      items:
        - label: "Terms"
          href: "/terms-and-conditions"
        - label: "Privacy Policy"
          href: "/privacy-policy"

customTheme:
  id: "stackwright-docs"
  name: "Stackwright Docs"
  description: "Dark-mode-first documentation theme with golden yellow accents and monospace headings"
  colors:
    primary: "#FCC03E"   # Safety Yellow
    secondary: "#4FC3F7"
    accent: "#F59E0B"   # Amber - slightly darker accent
    background: "#0B1F3A"
    surface: "#1A2C46"
    text: "#FFFFFF"
    textSecondary: "#B0BEC5"
  darkColors:
    primary: "#92400E"   # Amber-800 — WCAG AA on white (was #FCC03E Safety Yellow)
    secondary: "#0288D1"
    accent: "#B45309"    # Amber-700 — WCAG AA on white (was #F59E0B)
    background: "#FDFDFD"
    surface: "#F5F5F5"
    text: "#1A1A2E"
    textSecondary: "#666666"
  typography:
    fontFamily:
      primary: "JetBrains Mono"
      secondary: "Inter"
    scale:
      xs: "0.75rem"
      sm: "0.875rem"
      base: "1rem"
      lg: "1.125rem"
      xl: "1.25rem"
      2xl: "1.5rem"
      3xl: "1.875rem"
  spacing:
    xs: "0.5rem"
    sm: "0.75rem"
    md: "1rem"
    lg: "1.5rem"
    xl: "2rem"
    2xl: "3rem"
