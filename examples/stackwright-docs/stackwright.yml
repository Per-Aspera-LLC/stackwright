title: "Stackwright"
meta:
  base_url: https://trystackwright.dev
  description: "YAML is the syntax. The schema is the safety net. AI writes the code. From API spec to working Next.js app in hours — safe by construction."

appBar:
  titleText: ""
  backgroundColor: "primary"
  textColor: "#1A1A2E"   # Dark navy for readability on yellow
  colorModeToggle: true
  logo:
    type: image
    src: ./stackwright-alt.png
    height: 60
    width: 180

navigation:
  - label: "Home"
    href: "/"
  - label: "Getting Started"
    href: "/getting-started"
#  - label: "⌨️ CLI"
#    href: "/cli"
  - label: "🦦 Raft"
    href: "/otter-raft"

# Search configuration (Cmd+K to open)
search:
  enabled: true
  placeholder: "Search docs... ⌘K"

# Sidebar navigation (persistent left sidebar)
sidebar:
  navigation:
    - section: "Learn"
      items:
        - label: "\U0001F680 Getting Started"
          href: "/getting-started"
        - label: "\U0001F4E6 Content Types"
          href: "/content-types"
        - label: "\U0001F9EA Showcase"
          href: "/showcase"
    - section: "Reference"
      items:
        - label: "\U0001F3D7\uFE0F Architecture"
          href: "/architecture"
        - label: "\u2328\uFE0F CLI Reference"
          href: "/cli"
        - label: "\U0001F916 Otter Raft"
          href: "/otter-raft"
    - section: "More"
      items:
        - label: "\U0001F4CA Proof"
          href: "/proof"
        - label: "\U0001F510 Pro"
          href: "/pro"
        - label: "\U0001F64F Acknowledgements"
          href: "/acknowledgements"

  collapsed: false
  width: 260
  mobileBreakpoint: 768

footer:
  backgroundColor: "primary"
  textColor: "#1A1A2E"
  links:
    - label: "🦦 Built with StackWright 🦦"
      href: "https://github.com/Per-Aspera-LLC/stackwright"
    - label: "Source for this Site"
      href: "https://github.com/Per-Aspera-LLC/stackwright/tree/main/examples/stackwright-docs"
    - section: "Legal"
      items:
        - label: "Terms"
          href: "/terms-and-conditions"
        - label: "Privacy Policy"
          href: "/privacy-policy"

customTheme:
  id: "stackwright-docs"
  name: "Stackwright Docs"
  description: "Navy-and-gold documentation theme with monospace headings — light mode: navy text on white; dark mode: white text on navy"
  colors:
    primary: "#FCC03E"       # Safety Yellow — appBar/button bg, navy text on top
    secondary: "#0277BD"     # WCAG AA blue on white (darkened from dark-mode #4FC3F7)
    accent: "#D97706"        # Amber-600 — WCAG AA on white (darkened from dark-mode #F59E0B)
    background: "#FFFFFF"    # White
    surface: "#F0F4F8"       # Subtle blue-grey tint (nods to navy palette)
    text: "#0B1F3A"          # Navy — matches dark-mode background
    textSecondary: "#3D5A80" # Mid-navy — readable on white
  darkColors:
    primary: "#FCC03E"       # Safety Yellow
    secondary: "#4FC3F7"     # Light Blue
    accent: "#F59E0B"        # Amber
    background: "#0B1F3A"    # Dark Navy
    surface: "#1A2C46"       # Navy
    text: "#FFFFFF"          # White
    textSecondary: "#B0BEC5" # Blue Grey
  typography:
    fontFamily:
      primary: "JetBrains Mono"
      secondary: "Inter"
    scale:
      xs: "0.75rem"
      sm: "0.875rem"
      base: "1rem"
      lg: "1.125rem"
      xl: "1.25rem"
      2xl: "1.5rem"
      3xl: "1.875rem"
  spacing:
    xs: "0.5rem"
    sm: "0.75rem"
    md: "1rem"
    lg: "1.5rem"
    xl: "2rem"
    2xl: "3rem"
