content:
  meta:
    title: "Proof | StackWright"
    description: "The honest receipts. One operator, ~450 hours, near-zero cash — measured against a $4.6M COCOMO equivalent. Every number reproducible."

  content_items:

    # ──────────────────────────────────────────────
    # 1. Hero
    # ──────────────────────────────────────────────
    - type: main
      label: hero
      heading:
        text: "One operator. ~450 hours. 133,762 lines of code."
        textSize: h1
      textBlocks:
        - text: "AI-compressed development, honestly accounted: ~$135K–$220K in operator time versus a $4.6M COCOMO equivalent — a 21–34x compression ratio. Every number on this page traces to a command you can run yourself."
          textSize: h3
        - text: "Measured June 2026 using scc v3.7.0. Three separate repos. No rounding in a flattering direction."
          textSize: body1
      background: background

    # ──────────────────────────────────────────────
    # 2. Honest Accounting
    # ──────────────────────────────────────────────
    - type: text_block
      label: honest-accounting
      heading:
        text: "The Honest Accounting"
        textSize: h2
      textBlocks:
        - text: "**The all-in honest number:** Operator time at a senior architect rate ($300–490/hr x ~450 hours) costs $135,000–$220,500. The COCOMO-estimated cost for a conventional team writing the same 133,762 lines from scratch: $4,615,775. That gives a compression ratio of **21–34x** — and that's the number we lead with, because it's the honest one."
          textSize: body1
        - text: "**Labor compression:** COCOMO estimates ~410 person-months (24.59 months x 16.67 engineers) for a conventional team. The actual build: roughly 1 person x ~3 months of active work (131 active commit days, ~450 operator hours). The 410-to-1 compression in labor units is wage-independent — it holds regardless of what you pay engineers."
          textSize: body1
        - text: "**Hard cash:** ~$0 metered build cost. The flat Claude Code Max subscription (~$100/mo) is excluded the same way a tool subscription is excluded on comparable receipts pages — it's overhead, not a per-project charge. This number is real, but it ignores operator time. We call it out separately and label it 'real but unfair.'"
          textSize: body1
      background: background

    - type: alert
      label: cocomo-caveat
      variant: warning
      title: "COCOMO is a model, not a measurement"
      body: "The $4,615,775 figure is produced by COCOMO (organic mode) as implemented in scc v3.7.0. COCOMO (Boehm, 1981) models the effort required for a conventional team writing this codebase from scratch. Its two most sensitive inputs are: (1) the average wage assumption (scc default ~$56K/yr) and (2) the overhead multiplier (default 1.0). We also provide a loaded alternative at $180K/yr, 2x overhead = $12,302,174. The wage-independent metrics — 24.59 months, 16.67 engineers — survive any wage dispute."
      background: background

    # ──────────────────────────────────────────────
    # 3. COCOMO Comparison Tabs
    # ──────────────────────────────────────────────
    - type: tabbed_content
      label: cocomo-tabs
      heading:
        text: "COCOMO Detail — Two Scenarios"
        textSize: h2
      background: surface
      tabs:
        - label: "Reproducible Default"
          type: code_block
          language: bash
          lineNumbers: false
          code: |
            # PRIMARY figure — reproducible with default scc settings
            # Tool: scc v3.7.0 (github.com/boyter/scc)
            # Clone the repos, then run:
            scc --include-ext ts,tsx,py,js,jsx,sh,go,rs oss/ pro/ services/

            # Output (abbreviated):
            # ──────────────────────────────────────────────────────────────
            # Language       Files     Lines      Code  Comments    Blanks
            # TypeScript       957   177,303   130,724    23,874    22,705
            # JavaScript        27     2,283     1,743       258       282
            # Shell             10     1,294     1,016       153       125
            # Python             1       237       186        29        22
            # ──────────────────────────────────────────────────────────────
            # Estimated Cost to Develop (organic):  $4,615,775
            # Estimated Schedule (organic):          24.59 months
            # Estimated Average Team Size:           16.67 people
            # Total Lines of Code:                  133,762

        - label: "Loaded ($180K, 2x overhead)"
          type: code_block
          language: bash
          lineNumbers: false
          code: |
            # ALTERNATIVE — state the inputs before reading the output
            # wage assumption:      $180,000/yr (senior architect band)
            # overhead multiplier:  2.0
            scc --avg-wage 180000 --overhead 2.0 \
                --include-ext ts,tsx,py,js,jsx,sh,go,rs \
                oss/ pro/ services/

            # Output (abbreviated):
            # ──────────────────────────────────────────────────────────────
            # Estimated Cost to Develop (organic):  $12,302,174
            # Estimated Schedule (organic):          24.59 months
            # Estimated Average Team Size:           16.67 people
            # ──────────────────────────────────────────────────────────────
            # Note: schedule and team size are wage-independent.
            # Only the dollar figure changes when you vary --avg-wage.

    - type: text_block
      label: wage-independent
      heading:
        text: "The Numbers That Survive Any Wage Debate"
        textSize: h3
      textBlocks:
        - text: "Regardless of wage assumption, two COCOMO outputs are identical: **~25 months** of estimated schedule and **~17 engineers** of estimated team size. That is ~410 person-months of conventional-team effort — compared to 1 person x ~450 hours. The compression in labor units is wage-independent and holds under any costing model."
          textSize: body1
      background: surface

    # ──────────────────────────────────────────────
    # 4. What Got Built
    # ──────────────────────────────────────────────
    - type: feature_list
      label: what-got-built
      heading:
        text: "What Got Built"
        textSize: h2
      columns: 3
      background: surface
      items:
        - icon:
            type: icon
            src: Box
            height: 40
            label: oss-icon
          heading: "OSS Framework"
          description: "17 packages (16 published). Rendering engine, CLI, MCP server, theme system, SBOM generator, MapLibre integration, icon registry, build pipeline, Zod-validated schemas."
        - icon:
            type: icon
            src: Shield
            height: 40
            label: pro-icon
          heading: "Pro Framework"
          description: "19 packages (18 published). OpenAPI integration, CAC/PIV + OIDC auth, 4-layer compliance engine, Pulse live data, workflow engine, Cesium 3D globe, deck.gl."
        - icon:
            type: icon
            src: Server
            height: 40
            label: services-icon
          heading: "Services Tier"
          description: "9 packages (8 published). Backend compiler, capability registry, Hono runtime, dual-target build (Lambda + Helm), typed predicate schema, closed 10-operator set."
        - icon:
            type: icon
            src: FileCheck
            height: 40
            label: compliance-icon
          heading: "Compliance Engine"
          description: "NIST 800-53, CMMC L2 (110 practices), NIST 800-171r3 (130 controls), FedRAMP (103 annual controls), NIST SSDF. OSCAL v1.1.2 export for FedRAMP ATO packages."
        - icon:
            type: icon
            src: Lock
            height: 40
            label: security-arch-icon
          heading: "Security Architecture"
          description: "MCP structural confinement (26+ tools, no shell/write-arbitrary). SHA-256 otter integrity with constant-time comparison. safe_write chokepoint with path traversal rejection and symlink guards."
        - icon:
            type: icon
            src: Globe
            height: 40
            label: output-icon
          heading: "Production Output"
          description: "2 live sites (peraspera.llc, trystackwright.dev). 5,671 tests across 287 test files. 179 Markdown docs (64,877 lines). 1,501 commits across 3 repos over ~10.8 months."

    # ──────────────────────────────────────────────
    # 5. Our Receipts
    # ──────────────────────────────────────────────
    - type: text_block
      label: receipts-heading
      heading:
        text: "Our Receipts — How We Measured"
        textSize: h2
      textBlocks:
        - text: "Every metric on this page was produced by a reproducible command. Measurement date: June 2026. The commands below assume you have cloned the three repos (`oss/`, `pro/`, `services/`) and installed scc v3.7.0."
          textSize: body1
      background: background

    - type: code_block
      label: receipt-loc
      language: bash
      lineNumbers: false
      code: |
        # Reproducible — clone the repos and run this yourself
        scc --include-ext ts,tsx,py,js,jsx,sh,go,rs oss/ pro/ services/

        # Results: 133,762 code lines / 177,303 total lines / 996 files
      background: background

    - type: code_block
      label: receipt-commits
      language: bash
      lineNumbers: false
      code: |
        # Three separate repos — sum the counts
        git -C oss rev-list --count HEAD       # 736
        git -C pro rev-list --count HEAD       # 656
        git -C services rev-list --count HEAD  # 109
        # Total: 1,501
      background: background

    - type: code_block
      label: receipt-active-days
      language: bash
      lineNumbers: false
      code: |
        # Active commit days — per-repo count of unique calendar days
        git -C oss log --format='%ad' --date=short | sort -u | wc -l       # 60
        git -C pro log --format='%ad' --date=short | sort -u | wc -l       # 65
        git -C services log --format='%ad' --date=short | sort -u | wc -l  # 6
        # Per-repo sum: 131 active days
        # ~450 operator hours / 131 days ~= 3.4h/day (self-estimate, not instrumented)
      background: background

    - type: code_block
      label: receipt-tests
      language: bash
      lineNumbers: false
      code: |
        # Run in each tier root
        pnpm test --run
        # OSS:      1,472 tests / 84 test files
        # Pro:      2,677 tests / 126 test files
        # Services: 1,522 tests / 77 test files
        # Total:    5,671 tests / 287 test files
      background: background

    # ──────────────────────────────────────────────
    # 6. Security Posture
    # ──────────────────────────────────────────────
    - type: alert
      label: security-caveat
      variant: note
      title: "Self-assessed, not independently audited"
      body: "We claim 'aligned,' not 'certified.' Every item below is implemented in source code — verify by reading the files cited. No third-party audit has been performed."
      background: surface

    - type: feature_list
      label: security-posture
      heading:
        text: "Security Posture"
        textSize: h2
      columns: 2
      background: surface
      items:
        - icon:
            type: icon
            src: Shield
            height: 40
            label: confinement-icon
          heading: "Structural Confinement"
          description: "MCP tool surface is the security boundary. No shell access, no write-arbitrary. 26+ registered tools — exhaustively enumerable. Agents can only do what the tool list permits."
        - icon:
            type: icon
            src: Key
            height: 40
            label: integrity-icon
          heading: "Agent Integrity"
          description: "SHA-256 checksums on all 9 otter definitions. Constant-time comparison via timingSafeEqual. Symlink rejection, binary validation (setuid/setgid via fstatSync, TOCTOU-resistant), O_EXCL atomic POSIX pipeline lock."
        - icon:
            type: icon
            src: FileCheck
            height: 40
            label: compliance-sec-icon
          heading: "Compliance Engine"
          description: "NIST 800-53, CMMC L2, FedRAMP, and NIST SSDF assessment engines. OSCAL v1.1.2 export implemented (exportAsOSCAL). 4-layer assessment framework. Aligned — not certified."
        - icon:
            type: icon
            src: Package
            height: 40
            label: supply-chain-icon
          heading: "Supply Chain"
          description: "SBOM in SPDX 2.3, CycloneDX 1.5, and Build Manifest with Zod-validated schemas. CVE enrichment via OSV.dev (real HTTPS calls). Sigstore signing (real cosign; verification has a TODO). SLSA L3 provenance attestation schema implemented; hermetic runner is external."
        - icon:
            type: icon
            src: Lock
            height: 40
            label: auth-icon
          heading: "Authentication"
          description: "CAC/PIV: PKI header signing, revocation checking — 3,617 lines in auth package. OIDC: discovery, PKCE, token exchange. RBAC and audit logging. Allowlist-only environment stripping via buildCodePuppyEnv()."
        - icon:
            type: icon
            src: ShieldCheck
            height: 40
            label: backend-safety-icon
          heading: "Backend Safety"
          description: "Typed predicate schema with closed 10-operator set. No eval, no regex, no expression strings. Least-privilege permission derivation. projectOnly: true mode. safe_write per-otter allowlists with foreman blocked."

    # ──────────────────────────────────────────────
    # 7. Methods & Honesty
    # ──────────────────────────────────────────────
    - type: text_block
      label: methods
      heading:
        text: "Methods and Honesty"
        textSize: h2
      textBlocks:
        - text: "**Hard cash vs. operator time.** The ~$0 metered build cost is kept separate from imputed operator time ($135K–$220K). The flat Claude Code Max subscription (~$100/mo) is excluded the same way a tool subscription is excluded on comparable receipts pages — it is overhead, not a per-project charge."
          textSize: body1
        - text: "**Operator hours.** The 450-hour figure is a self-estimate, not instrumented. There are no session logs. It is bounded by 131 active commit days at ~3.4 hours/day. Git commit density provides a rough bound; the actual number could be lower."
          textSize: body1
        - text: "**COCOMO sensitivity.** The model has two sensitive inputs: (1) the average wage assumption (scc default ~$56K/yr vs. our loaded $180K) and (2) the overhead multiplier (default 1.0 vs. our loaded 2.0). The reproducible-default figure ($4,615,775) is primary; the loaded figure ($12,302,174) is a labeled alternative."
          textSize: body1
        - text: "**What COCOMO measures.** COCOMO (organic mode, Boehm 1981) estimates effort for a conventional team writing the same codebase from scratch. It does not distinguish hand-authored logic from generated config and schema files. The actual codebase includes both — COCOMO counts all lines equally."
          textSize: body1
        - text: "**Compression ratio robustness.** The 21–34x compression holds even if you vary the operator's hourly rate within the senior architect band ($300–490/hr), because both the numerator (COCOMO floor) and denominator (operator cost) move proportionally."
          textSize: body1
      background: background

    - type: alert
      label: sensitivity-alert
      variant: info
      title: "The two numbers this model is most sensitive to"
      body: "The operator's hourly rate and the share of the codebase that is hand-authored logic vs. generated artifacts. We report both levers; you decide the weights."
      background: background

    # ──────────────────────────────────────────────
    # 8. Sources
    # ──────────────────────────────────────────────
    - type: text_block
      label: sources
      heading:
        text: "Sources"
        textSize: h2
      textBlocks:
        - text: "• scc v3.7.0 — github.com/boyter/scc — COCOMO model (Boehm, 1981; organic mode)"
          textSize: body2
        - text: "• NIST SP 800-53 Rev 5 — Security and Privacy Controls for Information Systems and Organizations"
          textSize: body2
        - text: "• CMMC Level 2 Assessment Guide v2.0 — 110 practices"
          textSize: body2
        - text: "• NIST SP 800-171 Rev 3 — Protecting Controlled Unclassified Information (130 controls)"
          textSize: body2
        - text: "• FedRAMP Annual Assessment Controls Selection Worksheet — 103 annual controls"
          textSize: body2
        - text: "• OSCAL v1.1.2 — Open Security Controls Assessment Language (NIST)"
          textSize: body2
        - text: "• NIST SP 800-218 — Secure Software Development Framework (SSDF)"
          textSize: body2
        - text: "• SLSA v1.0 specification — slsa.dev"
          textSize: body2
        - text: "• OSV.dev — Open Source Vulnerability database"
          textSize: body2
        - text: "• Sigstore — sigstore.dev — software signing and transparency"
          textSize: body2
      background: background

    # ──────────────────────────────────────────────
    # 9. Meta-note
    # ──────────────────────────────────────────────
    - type: alert
      label: meta-note
      variant: tip
      title: "This page is its own proof point"
      body: "This page was composed by the framework's own agents, against its own schema, validated by its own build pipeline. The proof page being built by the tool it documents is itself one of the proof points."
      background: surface
